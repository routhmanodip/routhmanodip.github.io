<body>
  <!-- ===== Header / Nav ===== -->
  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="brand">M. Routh, Ph.D.</a>
      <ul class="nav-links" id="nav-menu">
        <li><a href="index.html">Home</a></li>

          <span class="theme-icon">🌙</span>

        <button id="nav-toggle" class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-menu">
          <span></span><span></span><span></span>

  <!-- ===== Lock screen ===== -->
  <div id="lock-screen" class="lock-screen">
    <form id="lock-form" class="lock-form">
      <p class="lock-label">This page is password protected</p>
      <input type="password" id="lock-password" placeholder="Password" autocomplete="off" />
      <button type="submit">Unlock</button>
      <p id="lock-error" class="lock-error" hidden>Incorrect password.</p>
    </form>
  </div>

  <main id="resources-main" hidden>
    <!-- ===== Resources ===== -->
    <section id="resources" class="section container">
      <h2 class="section-title">Resources</h2>
      <p class="lead">A collection of tools/ papers / presentations that I've found useful / interesting</p>

      <p>To be updated.</p>
    </section>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <p class="copyright">© <span id="year"></span> Manodip Routh. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script>
    (function () {
      const RESOURCES_HASH = "b06ab6291d21ab143e6392dac81ddcbb57b67f3e04681917d51b3b024cd201aa";
      const mainEl = document.getElementById("resources-main");
      const lockEl = document.getElementById("lock-screen");
      const form = document.getElementById("lock-form");
      const input = document.getElementById("lock-password");
      const errorEl = document.getElementById("lock-error");

      async function sha256Hex(text) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
      }

      function unlock() {
        mainEl.hidden = false;
        lockEl.hidden = true;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const hash = await sha256Hex(input.value);
        if (hash === RESOURCES_HASH) {
          unlock();
        } else {
          errorEl.hidden = false;
          input.value = "";
          input.focus();
        }
      });
    })();
  </script>
</body>
</html>
